name: iOS Build (Unsigned)

on:
  workflow_dispatch: # Allows you to manually trigger a build

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign
        
      - name: Package into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr app.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Mindflow-iOS-App
          path: build/ios/iphoneos/app.ipa
